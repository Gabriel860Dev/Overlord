name: overlord
description: Um projeto Flutter para RPG de mesa.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter
    
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  file_picker: ^8.0.0
  share_plus: ^10.1.0
  path_provider: ^2.1.5
  flutter_colorpicker: ^1.1.0
  multi_select_flutter: ^4.1.3
  google_fonts: ^6.2.1
  reorderable_grid_view: ^2.2.8
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/dice-2/